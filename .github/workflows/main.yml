name: Build and Export APK

on:
  push:
    branches:
      - master

jobs:
  
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: '31'
        build-tools: '31.0.0'
        ndk: '23.1.7779620'

    - name: Ensure Gradle Wrapper Exists
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradle wrapper not found. Generating..."
          gradle wrapper --gradle-version 7.5.0
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make autoconf automake git python3 binutils
        sudo apt-get install -y libtool-bin pkg-config flex bison gettext texinfo rsync

    - name: Verify directory structure
      run: |
        echo "Listing directory structure"
        ls -R

    - name: Get and compile external libraries
      run: |
        cd ./limbo-android-lib/src/main/jni
        # Add commands to download and compile external libraries here

    - name: Apply patches
      run: |
        if [ -d "./limbo-android-lib/src/main/jni/qemu/" ]; then
          cd ./limbo-android-lib/src/main/jni/qemu/
          patch -p1 < ../patches/qemu-5.1.0.patch
        fi

        if [ -d "./limbo-android-lib/src/main/jni/glib/" ]; then
          cd ../../../glib/
          patch -p1 < ../patches/glib-2.56.1.patch
        fi

        if [ -d "./limbo-android-lib/src/main/jni/SDL2/" ]; then
          cd ../../../SDL2/
          patch -p1 < ../patches/sdl2-2.0.8.patch
        fi

    - name: Build and export APK
      run: |
        #cd ./limbo-android-lib/
        ./gradlew build
        ./gradlew assembleDebug
        mkdir -p android/app/build/outputs/apk/release
        cp app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Make limbo
      run: |
        export BUILD_GUEST=x86_64-softmmu
        make limbo

    - name: Clean up
      run: |
        sudo apt-get clean
